plugins {
    id 'com.android.application'
}

android {
    namespace 'com.manvi.gate'
    compileSdk 34

    defaultConfig {
        applicationId "com.manvi.gate"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
